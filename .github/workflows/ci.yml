name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Go test
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build -buildvcs=false ./...

      - name: Frontend test
        run: npm run test:js

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate shell scripts
        run: bash -n deploy/*.sh

      - name: Prepare smoke-test configuration
        run: |
          mkdir -p repos/ci/content repos/ci/static
          printf '[tools]\n' > repos/ci/mise.toml
          cp deploy/.env.example .env
          sed -i 's|^APP_URL=.*|APP_URL=http://localhost:8080|' .env
          sed -i 's|^GITHUB_CLIENT_ID=.*|GITHUB_CLIENT_ID=ci-client-id|' .env
          sed -i 's|^GITHUB_CLIENT_SECRET=.*|GITHUB_CLIENT_SECRET=ci-client-secret|' .env
          sed -i 's|^SESSION_SECRET=.*|SESSION_SECRET=ci-session-secret-at-least-32-characters|' .env
          sed -i 's|^ALLOWED_GITHUB_USERS=.*|ALLOWED_GITHUB_USERS=ci-user|' .env
          sed -i 's|^REPO_PATH=.*|REPO_PATH=/data/repos/ci|' .env
          sed -i 's|^HUGO_CMS_REPOS=.*|HUGO_CMS_REPOS=/data/repos/ci|' .env
          sed -i 's|^HUGO_CMS_UID=.*|HUGO_CMS_UID=1000|' .env
          sed -i 's|^HUGO_CMS_GID=.*|HUGO_CMS_GID=27|' .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Verify Compose security boundaries
        run: |
          docker compose --profile tools config --format json \
            | jq -e '.services["tool-bootstrap"].environment | (has("SESSION_SECRET") or has("GITHUB_CLIENT_SECRET")) | not'
          docker compose config --format json \
            | jq -e '.services["hugo-cms"].ports[0].host_ip == "127.0.0.1"'

      - name: Build image
        run: docker compose build hugo-cms

      - name: Verify non-root runtime
        run: |
          runtime_uid="$(docker compose run --rm --no-deps --entrypoint id hugo-cms -u)"
          runtime_gid="$(docker compose run --rm --no-deps --entrypoint id hugo-cms -g)"
          test "${runtime_uid}" = "1000"
          test "${runtime_gid}" = "27"

      - name: Verify tools profile without implicit repository discovery
        run: docker compose --profile tools run --rm tool-bootstrap

      - name: Health smoke test
        run: |
          docker compose up -d hugo-cms
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 1
          done
          docker compose logs hugo-cms
          exit 1

      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color

      - name: Cleanup
        if: always()
        run: docker compose down --volumes --remove-orphans
