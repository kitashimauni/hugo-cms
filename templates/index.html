<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hugo Home CMS</title>
    <link rel="stylesheet" href="/admin/static/css/style.css">
</head>
<body>

    <div id="sidebar-backdrop" onclick="toggleSidebar()"></div>

    <aside>
        <div class="sidebar-header">
            Hugo CMS
            <button class="action-btn secondary mobile-only" onclick="toggleSidebar()" style="padding: 2px 8px;">×</button>
        </div>
        <div id="site-selector-container" class="site-selector"></div>
        <div id="config-warning-panel" class="config-warning-panel hidden"></div>
        <div class="sidebar-actions">
            <button class="action-btn success" onclick="createNewFile()">+ New File</button>
            <button class="action-btn secondary" onclick="runSync()">🔄 Sync</button>
        </div>
        <div id="file-list">Loading...</div>
    </aside>

    <main>
        <header>
            <div style="display: flex; align-items: center; gap: 10px;">
                <button id="mobile-menu-btn" class="action-btn secondary" onclick="toggleSidebar()">☰</button>
                <div id="filename-display">Select a file...</div>
                <span id="save-status" style="margin-left: 10px; font-size: 12px; color: #888;"></span>
            </div>
            
            <div style="display: flex; align-items: center;">
                <div class="view-toggles">
                    <button class="view-toggle active" id="btn-view-edit" onclick="switchView('edit')">Edit</button>
                    <button class="view-toggle" id="btn-view-preview" onclick="switchView('preview')">本文プレビュー</button>
                    <button class="view-toggle" id="btn-view-split" onclick="toggleSplitView()">Split</button>
                </div>
                
                <div class="header-actions">
                    <button class="action-btn" onclick="saveFile()">💾 <span>Save</span></button>
                    
                    <div class="desktop-actions">
                        <button class="action-btn secondary" onclick="insertImage()">🖼️ <span>Image</span></button>
                        <button class="action-btn secondary" onclick="insertSnippet()">📝 <span>Snippet</span></button>
                        <button class="action-btn secondary" onclick="resetChanges()">↺ <span>Reset</span></button>
                        <button class="action-btn secondary" onclick="showDiff()">⚖️ <span>Diff</span></button>
                        <button class="action-btn danger" onclick="deleteFile()">🗑️ <span>Delete</span></button>
                    </div>

                    <div class="mobile-actions">
                        <button class="action-btn secondary" onclick="toggleHeaderMenu()">⋮</button>
                        <div id="header-menu-dropdown" class="dropdown-content">
                            <button class="dropdown-item" onclick="insertImage(); toggleHeaderMenu()">🖼️ Insert Image</button>
                            <button class="dropdown-item" onclick="insertSnippet(); toggleHeaderMenu()">📝 Insert Snippet</button>
                            <button class="dropdown-item" onclick="resetChanges(); toggleHeaderMenu()">↺ Reset</button>
                            <button class="dropdown-item" onclick="showDiff(); toggleHeaderMenu()">⚖️ Diff</button>
                            <button class="dropdown-item danger-text" onclick="deleteFile(); toggleHeaderMenu()">🗑️ Delete</button>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <section id="deployment-panel" class="deployment-panel hidden" aria-label="デプロイプレビュー">
            <div class="deployment-heading">
                <strong>デプロイプレビュー</strong>
                <span id="deployment-provider" class="deployment-provider"></span>
                <span id="deployment-status" class="deployment-status idle">未作成</span>
                <code id="deployment-commit" class="deployment-commit"></code>
            </div>
            <div id="deployment-access-warning" class="deployment-access-warning hidden" role="alert">
                Accessで保護されていません。未公開コンテンツが外部へ公開される可能性があります。
            </div>
            <div id="deployment-message" class="deployment-message" aria-live="polite"></div>
            <div class="deployment-actions">
                <button id="deployment-update-btn" class="action-btn" onclick="updateDeploymentPreview()">デプロイプレビューを更新</button>
                <button id="deployment-retry-btn" class="action-btn secondary hidden" onclick="retryDeploymentPreview()">再試行</button>
                <button id="deployment-discard-btn" class="action-btn danger hidden" onclick="discardDeploymentPreview()">破棄</button>
                <a id="deployment-open-link" class="deployment-link hidden">デプロイプレビューを開く</a>
                <a id="deployment-log-link" class="deployment-link hidden">ビルドログを開く</a>
                <button id="publish-preview-btn" class="action-btn success hidden" onclick="publishFile()">PRを作成して公開へ進む</button>
            </div>
        </section>

        <div id="content-area">
            <div id="edit-view">
                <div id="fm-container" style="display:none;"></div>
                <div id="editor-wrapper">
                    <textarea id="editor" spellcheck="false" placeholder="Select a file to edit..."></textarea>
                </div>
            </div>

            <div id="preview-view">
                <div class="markdown-preview-notice" role="note">
                    Markdown本文の簡易表示です。generator固有のtemplate、shortcode、サイト固有CSS/JavaScriptは再現しません。
                </div>
                <div id="markdown-preview-status" class="markdown-preview-status empty" aria-live="polite">
                    記事を選択すると本文プレビューを表示します。
                </div>
                <article id="markdown-preview" class="markdown-preview-content"></article>
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div id="modal-overlay">
        <div id="modal-box">
            <div id="modal-header">
                <span style="font-weight:bold;">Diff</span>
                <button class="action-btn secondary" onclick="closeModal()">Close</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <script type="module" src="/admin/static/js/app.js"></script>
</body>
</html>
